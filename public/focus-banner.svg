<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="513" viewBox="0 0 1024 513" role="img" aria-labelledby="title desc">
  <title id="title">FOCUS facility operations dashboard</title>
  <desc id="desc">A teal and slate banner showing the FOCUS facility operations control system.</desc>
  <defs>
